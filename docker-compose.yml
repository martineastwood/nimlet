services:
  nimlet:
    build: .
    image: nimlet:install-smoke
    container_name: nimlet-install
    # Optional pin, e.g. NIMLET_VERSION=v0.1.1 docker compose run --rm nimlet
    environment:
      - NIMLET_VERSION
      - OPENROUTER_API_KEY
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - HYPER_API_KEY
    # One-shot: install + --version, then exit. Rebuild if Dockerfile changed:
    #   docker compose build --no-cache && docker compose run --rm nimlet
