name: Package macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/package-macos.sh"
      - ".github/workflows/package-macos.yml"
      - "src/**"
      - "nimlet.nimble"
      - "nim.cfg"
      - "config.nims"

permissions:
  contents: write

concurrency:
  group: package-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install nim openssl@3 pcre ripgrep
          nim --version
          nimble --version

      - name: Package macOS tarball
        run: ./scripts/package-macos.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nimlet-macos-aarch64
          path: |
            dist/nimlet-macos-aarch64.tar.gz
            dist/nimlet-macos-aarch64.tar.gz.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nimlet-macos-aarch64.tar.gz
            dist/nimlet-macos-aarch64.tar.gz.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
