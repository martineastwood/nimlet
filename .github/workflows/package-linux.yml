name: Package Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/package-linux.sh"
      - "scripts/test-linux-install.sh"
      - ".github/workflows/package-linux.yml"
      - "src/**"
      - "nimlet.nimble"
      - "nim.cfg"
      - "config.nims"

permissions:
  contents: write

concurrency:
  group: package-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on 22.04 so bundled OpenSSL/PCRE stay within glibc 2.35.
          # ubuntu-latest (24.04) ships libs that need GLIBC_2.38+, which
          # breaks Debian bookworm and other still-common hosts.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev libssl3 libpcre3 libpcre3-dev patchelf ripgrep binutils file

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          use-nightlies: false

      - name: Package Linux tarball
        run: ./scripts/package-linux.sh

      - name: Smoke-test tarball in a clean container
        run: ./scripts/test-linux-install.sh "dist/nimlet-linux-${{ matrix.arch }}.tar.gz"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nimlet-linux-${{ matrix.arch }}
          path: |
            dist/nimlet-linux-${{ matrix.arch }}.tar.gz
            dist/nimlet-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nimlet-linux-${{ matrix.arch }}.tar.gz
            dist/nimlet-linux-${{ matrix.arch }}.tar.gz.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
